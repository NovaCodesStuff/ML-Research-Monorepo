[project]
name = "audio-ml-lab"
version = "0.1.0"
description = "Modern ML architectures implemented from first principles and tested on audio."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "numpy>=1.26",
  "librosa>=0.10",
  "soundfile",
  "pandas",
  "matplotlib",
  "scikit-learn",
  "pyyaml",
  "tqdm",
  "einops",
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["lab"]

[tool.setuptools.packages.find]
include = ["models*", "experiments*"]
